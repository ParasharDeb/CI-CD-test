name: Check Linting and Format errors
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
jobs:
  checking-linting:
    runs-on: Ubuntu-latest
    steps:
      - name: Cloning the repository
        uses: actions/checkout@v4
      - name: Installing bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Lint_errors
        run: bun lint
      - name: Format_errors
        run: bun format